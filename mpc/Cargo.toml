[package]
name = "mpc"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
tokio = "1.47.1"
solana-client = "1.14.17"
solana-sdk = "1.18.26"
spl-memo = "3"
clap = { version = "3", features = ["derive", "color"] }
bs58 = "0.5.1"
rand07 = { package = "rand", version =  "0.7" }
ed25519-dalek = "1"
multi-party-eddsa = { git = "https://github.com/ZenGo-X/multi-party-eddsa" }
curv = { package = "curv-kzen", version = "0.9" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
solana-test-validator = "1"
solana-streamer = "1"
