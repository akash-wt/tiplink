[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
tokio = { version ="1.47.1",  features = ["full"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
store = { path= "../store" }
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
futures-util = "0.3.31"
